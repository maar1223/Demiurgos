<!-- wizard_done.html — success page after wizard completion -->

<article class="wizard-screen wizard-done" data-screen="done">
  <header>
    <h1>🚀 {{ t('welcome_title') }}</h1>
  </header>

  <div class="done-content">
    <p>{{ t('summary_subtitle') }}</p>

    {% if world_name %}
    <p><strong>{{ t('world_label') }}:</strong> <code>{{ world_name }}</code></p>
    {% endif %}
  </div>

  <footer class="wizard-nav">
    <a href="/" class="primary" role="button">
      {{ t('configured') }}
    </a>
  </footer>
</article>
