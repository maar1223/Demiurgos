<!-- wizard_done.html — success page after wizard completion -->

<div class="wizard-screen wizard-done" data-screen="done">
  <div class="done-content">
    <svg class="icon icon-xl"><use href="#check"/></svg>
    <h1>{{ t('welcome_title') }}</h1>

    <p class="done-subtitle">{{ t('summary_subtitle') }}</p>

    {% if world_name %}
    <p class="done-world"><strong>{{ t('world_label') }}:</strong> <code>{{ world_name }}</code></p>
    {% endif %}

    <a href="/" class="btn-primary">
      {{ t('configured') }}
    </a>
  </div>
</div>
