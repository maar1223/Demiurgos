<!-- =========================================================================
     screen_world.html — Screen 1: World Selection/Creation
     Toggle pattern: user picks "Create" or "Load", only one form shown.
     ========================================================================= -->

<div class="wizard-screen" data-screen="1">
  {% include "_progress.html" %}

  <div class="wizard-card">
    <div class="wizard-header">
      <h1>{{ t('world_title') }}</h1>
      <p>{{ t('world_subtitle') }}</p>
    </div>

    <form hx-post="/wizard/1"
          hx-target="#wizard-content"
          hx-swap="innerHTML"
          hx-push-url="true">

      <!-- Toggle: Create / Load -->
      <div class="toggle-group">
        <button type="button"
                class="toggle-btn active"
                id="toggle-create"
                onclick="switchWorldMode('create')">
          {{ t('create_new_world') }}
        </button>
        <button type="button"
                class="toggle-btn"
                id="toggle-load"
                onclick="switchWorldMode('load')">
          {{ t('load_existing_world') }}
        </button>
      </div>
      <input type="hidden" name="world_mode" id="world-mode" value="create">

      <!-- Create form (shown when mode=create) -->
      <div class="world-form-section" id="form-create">
        <div class="wizard-card world-form-card">
          <label for="world-name">{{ t('world_name_label') }}</label>
          <input type="text"
                 id="world-name"
                 name="world_name"
                 value="{{ world_name or '' }}"
                 placeholder="{{ t('world_name_placeholder') }}"
                 pattern="[a-z0-9-]+"
                 autocomplete="off">
          <span class="text-muted hint">{{ t('world_name_hint') }}</span>
        </div>
      </div>

      <!-- Load form (shown when mode=load) -->
      <div class="world-form-section" id="form-load" style="display:none">
        <div class="wizard-card world-form-card">
          <label for="world-name-load">{{ t('world_name_label') }}</label>
          <input type="text"
                 id="world-name-load"
                 name="world_name"
                 value="{{ world_name or '' }}"
                 placeholder="{{ t('world_name_placeholder') }}"
                 pattern="[a-z0-9-]+"
                 autocomplete="off">
          <span class="text-muted hint">{{ t('world_name_hint') }}</span>

          <label for="world-folder">{{ t('select_folder') }}</label>
          <div class="input-group">
            <input type="text"
                   id="world-folder"
                   name="world_folder"
                   placeholder="/path/to/your/world"
                   autocomplete="off">
            <button type="button" class="btn-secondary"
                    onclick="document.getElementById('world-upload').click()">
              {{ t('browse_button') }}
            </button>
            <input type="file"
                   id="world-upload"
                   name="world_upload"
                   accept=".docx"
                   style="display:none"
                   onchange="document.getElementById('world-folder').value=this.files[0]?.name||''">
          </div>
        </div>
      </div>

      <!-- Supported formats badges -->
      <div class="format-badges">
        <h3>{{ t('supported_formats') }}</h3>
        <div class="badge-group">
          <span class="badge supported">
            <svg class="icon icon-sm"><use href="#check"/></svg>
            {{ t('format_docx') }}
          </span>
          <span class="badge supported">
            <svg class="icon icon-sm"><use href="#check"/></svg>
            {{ t('format_md') }}
          </span>
          <span class="badge coming-soon">
            <svg class="icon icon-sm"><use href="#clock"/></svg>
            {{ t('format_notion') }}
          </span>
          <span class="badge coming-soon">
            <svg class="icon icon-sm"><use href="#clock"/></svg>
            {{ t('format_pdf') }}
          </span>
        </div>
      </div>

      {% include "_nav_next.html" %}
    </form>
  </div>
</div>

<script>
function switchWorldMode(mode) {
  document.getElementById('world-mode').value = mode;
  document.getElementById('toggle-create').classList.toggle('active', mode === 'create');
  document.getElementById('toggle-load').classList.toggle('active', mode === 'load');
  document.getElementById('form-create').style.display = mode === 'create' ? 'block' : 'none';
  document.getElementById('form-load').style.display = mode === 'load' ? 'block' : 'none';
}
</script>
