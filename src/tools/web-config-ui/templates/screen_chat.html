<!-- =========================================================================
     screen_chat.html — Screen 4: Chat Platforms
     
     Optional screen. Toggle cards for Telegram/Discord, others grayed out.
     ========================================================================= -->

<article class="wizard-screen" data-screen="4">
  <header>
    <h1>{{ t('chats_title') }}</h1>
    <p>{{ t('chats_explanation') }}</p>
  </header>

  <form hx-post="/wizard/4"
        hx-target="#wizard-content"
        hx-swap="innerHTML"
        hx-push-url="true">

    <div class="chat-providers">
      <!-- Telegram card -->
      <article class="card chat-provider-card">
        <header>
          <h2>✈️ {{ t('telegram') }}</h2>
        </header>
        <label class="toggle-row">
          <input type="checkbox"
                 name="chat_telegram"
                 role="switch"
                 {% if chat_telegram_enabled %}checked{% endif %}>
          <span>{{ t('enable_backup') }}</span>
        </label>
        <div class="chat-config-fields">
          <label for="telegram-token">Bot Token</label>
          <input type="password"
                 id="telegram-token"
                 name="telegram_token"
                 value="{{ telegram_token or '' }}"
                 placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11">
        </div>
      </article>

      <!-- Discord card -->
      <article class="card chat-provider-card">
        <header>
          <h2>🎮 {{ t('discord') }}</h2>
        </header>
        <label class="toggle-row">
          <input type="checkbox"
                 name="chat_discord"
                 role="switch"
                 {% if chat_discord_enabled %}checked{% endif %}>
          <span>{{ t('enable_backup') }}</span>
        </label>
        <div class="chat-config-fields">
          <label for="discord-token">Bot Token</label>
          <input type="password"
                 id="discord-token"
                 name="discord_token"
                 value="{{ discord_token or '' }}"
                 placeholder="MTAxMTE...">
        </div>
      </article>

      <!-- Coming soon cards (grayed out, non-interactive) -->
      <article class="card chat-provider-card disabled" aria-disabled="true">
        <header>
          <h2>💬 WhatsApp</h2>
        </header>
        <p><small>⌛ {{ t('coming_soon') }}</small></p>
      </article>

      <article class="card chat-provider-card disabled" aria-disabled="true">
        <header>
          <h2>📱 Slack</h2>
        </header>
        <p><small>⌛ {{ t('coming_soon') }}</small></p>
      </article>
    </div>

    <!-- Navigation -->
    <div class="wizard-nav">
      <button type="button" class="secondary"
              hx-get="/wizard/3"
              hx-target="#wizard-content"
              hx-swap="innerHTML"
              hx-push-url="true">
        ← {{ t('back') }}
      </button>
      <div class="wizard-nav-right">
        <button type="submit"
                name="action"
                value="skip"
                class="outline contrast skip-button">
          {{ t('skip_for_now') }} ⌛
        </button>
        <button type="submit"
                name="action"
                value="save"
                class="primary">
          {{ t('save_and_continue') }} →
        </button>
      </div>
    </div>

  </form>
</article>
