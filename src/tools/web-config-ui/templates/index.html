<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demiurgos — {{ t('welcome_title') }}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>

<main class="container wizard-container">

  <!-- Progress indicator -->
  {% include "_progress.html" %}

  <!-- Wizard content area — screen fragments are swapped here by htmx -->
  <section id="wizard-content" aria-live="polite">

    <!-- ================================================================= -->
    <!-- Screen 0: Language Selector                                        -->
    <!-- ================================================================= -->
    <article class="wizard-screen" data-screen="0">
      <header>
        <h1>{{ t('welcome_title') }}</h1>
        <p>{{ t('welcome_subtitle') }}</p>
      </header>

      <form hx-get="/wizard/screen/1"
            hx-target="#wizard-content"
            hx-swap="innerHTML"
            hx-push-url="true"
            aria-label="{{ t('select_language') }}">
        <fieldset>
          <legend>{{ t('select_language') }}</legend>
          <label>
            <input type="radio" name="lang" value="en" checked>
            English
          </label>
          <label>
            <input type="radio" name="lang" value="zh">
            中文
          </label>
          <label>
            <input type="radio" name="lang" value="hi">
            हिन्दी
          </label>
          <label>
            <input type="radio" name="lang" value="es">
            Español (neutro)
          </label>
          <label>
            <input type="radio" name="lang" value="es-ar">
            Español (rioplatense)
          </label>
          <label>
            <input type="radio" name="lang" value="fr">
            Français
          </label>
          <label>
            <input type="radio" name="lang" value="ar">
            العربية
          </label>
          <label>
            <input type="radio" name="lang" value="bn">
            বাংলা
          </label>
          <label>
            <input type="radio" name="lang" value="pt">
            Português
          </label>
          <label>
            <input type="radio" name="lang" value="ru">
            Русский
          </label>
          <label>
            <input type="radio" name="lang" value="ur">
            اردو
          </label>
        </fieldset>

        <button type="submit" class="primary">
          {{ t('continue_button') }} →
        </button>
      </form>
    </article>

  </section><!-- /#wizard-content -->

</main>

</body>
</html>
