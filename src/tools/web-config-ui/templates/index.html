<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demiurgos — {{ t('welcome_title') }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>

<!-- SVG Icon Sprite — referenced as <svg><use href="#icon-name"/></svg> -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- ArrowLeftIcon — 18×18 -->
  <symbol id="arrow-left" viewBox="0 0 18 18">
    <path d="M11.5 4L6.5 9l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ArrowRightIcon — 18×18 -->
  <symbol id="arrow-right" viewBox="0 0 18 18">
    <path d="M6.5 4l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ChevronDownIcon — 16×16 -->
  <symbol id="chevron-down" viewBox="0 0 16 16">
    <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- CheckIcon — 12×12 -->
  <symbol id="check" viewBox="0 0 12 12">
    <path d="M2 6l3 3 5-7" fill="none" stroke="#4A6B3E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ClockIcon — 12×12 -->
  <symbol id="clock" viewBox="0 0 12 12">
    <circle cx="6" cy="6" r="5" fill="none" stroke="#73685E" stroke-width="1"/>
    <path d="M6 3.5V6l2 1" fill="none" stroke="#73685E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- AlertTriangleIcon — 16×16 -->
  <symbol id="alert-triangle" viewBox="0 0 16 16">
    <path d="M8 2L1 14h14z" fill="none" stroke="#A85D3A" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="8" y1="6.5" x2="8" y2="9.5" stroke="#A85D3A" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="8" cy="12" r="0.6" fill="#A85D3A"/>
  </symbol>

  <!-- ZapIcon — 20×20 -->
  <symbol id="zap" viewBox="0 0 20 20">
    <path d="M10.5 1.5L2.5 12h7l-1 7 9-10.5h-7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </symbol>
</svg>

<main class="wizard-container">

  <!-- Progress indicator -->
  {% include "_progress.html" %}

  <!-- Wizard content area — screen fragments are swapped here by htmx -->
  <section id="wizard-content" aria-live="polite">

    <!-- Screen 0: Language Selector -->
    {% include "screen_lang.html" %}

  </section><!-- /#wizard-content -->

</main>

</body>
</html>
