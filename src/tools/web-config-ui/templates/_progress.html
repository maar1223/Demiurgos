<!-- =========================================================================
     _progress.html — Segment-based wizard progress indicator (7 steps)
     
     Context: current_step (int 0-6)
     7 fixed-width segments (80×6px): first (current_step + 1) lit in Llamita,
     rest in Filo.
     ========================================================================= -->

<div class="wizard-progress" aria-label="Step {{ current_step + 1 }} of 7">
  {% for i in range(7) %}
  <div class="progress-segment{% if i <= current_step %} active{% endif %}"></div>
  {% endfor %}
</div>
