<!-- =========================================================================
     screen_backup.html — Screen 5: Backup & Sync
     Optional screen. Google Drive toggle with rclone requirement notice.
     ========================================================================= -->

<div class="wizard-screen" data-screen="5">
  {% include "_progress.html" %}

  <div class="wizard-card">
    <div class="wizard-header">
      <h1>{{ t('backup_title') }}</h1>
      <p>{{ t('backup_explanation') }}</p>
    </div>

    <form hx-post="/wizard/5"
          hx-target="#wizard-content"
          hx-swap="innerHTML"
          hx-push-url="true">

      <div class="surface-card">
        <div class="chat-card-header">
          <h3>Google Drive</h3>
          <label class="toggle-row">
            <input type="checkbox"
                   name="backup_enabled"
                   role="switch"
                   {% if backup_enabled %}checked{% endif %}>
          </label>
        </div>

        <!-- rclone warning (shown when toggle is on but rclone not detected) -->
        {% if backup_enabled and not rclone_detected %}
        <div role="alert" class="warning-card">
          <svg class="icon icon-md"><use href="#alert-triangle"/></svg>
          <span>{{ t('rclone_warning') }}</span>
        </div>
        {% endif %}

        <!-- Backup config fields -->
        <div class="backup-config-fields">
          <label for="backup-interval">{{ t('backup_interval_label') }}</label>
          <div class="select-wrapper">
            <select id="backup-interval" name="backup_interval">
              <option value="hourly">{{ t('backup_interval_hourly') }}</option>
              <option value="daily" selected>{{ t('backup_interval_daily') }}</option>
              <option value="weekly">{{ t('backup_interval_weekly') }}</option>
            </select>
            <svg class="icon icon-sm select-chevron"><use href="#chevron-down"/></svg>
          </div>
        </div>
      </div>

      {% include "_nav_optional.html" %}
    </form>
  </div>
</div>
