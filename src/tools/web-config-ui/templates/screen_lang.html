<!-- =========================================================================
     screen_lang.html — Screen 0: Language Selector
     Rendered as a standalone htmx fragment that swaps into #wizard-content.
     ========================================================================= -->

<div class="wizard-screen" data-screen="0">
  {% include "_progress.html" %}

  <div class="wizard-card">
    <div class="wizard-header">
      <h1>{{ t('welcome_title') }}</h1>
      <p>{{ t('welcome_subtitle') }}</p>
    </div>
    <p class="step-indicator">{{ t('step_x_of_y', current=current_step+1, total=steps|length) }}</p>

    <form hx-post="/wizard/0"
          hx-target="#wizard-content"
          hx-swap="innerHTML"
          hx-push-url="true"
          aria-label="{{ t('select_language') }}">

      <div class="language-grid">
        <!-- Row 1 -->
        <button type="submit" name="lang" value="en" class="language-btn{% if lang == 'en' %} selected{% endif %}">English</button>
        <button type="submit" name="lang" value="zh" class="language-btn{% if lang == 'zh' %} selected{% endif %}">中文</button>
        <button type="submit" name="lang" value="hi" class="language-btn{% if lang == 'hi' %} selected{% endif %}">हिन्दी</button>
        <!-- Row 2 -->
        <button type="submit" name="lang" value="es" class="language-btn{% if lang == 'es' %} selected{% endif %}">Español (neutro)</button>
        <button type="submit" name="lang" value="es-ar" class="language-btn{% if lang == 'es-ar' %} selected{% endif %}">Español (Argentina)</button>
        <button type="submit" name="lang" value="fr" class="language-btn{% if lang == 'fr' %} selected{% endif %}">Français</button>
        <!-- Row 3 -->
        <button type="submit" name="lang" value="ar" class="language-btn{% if lang == 'ar' %} selected{% endif %}">العربية</button>
        <button type="submit" name="lang" value="bn" class="language-btn{% if lang == 'bn' %} selected{% endif %}">বাংলা</button>
        <button type="submit" name="lang" value="pt" class="language-btn{% if lang == 'pt' %} selected{% endif %}">Português</button>
        <!-- Row 4 -->
        <button type="submit" name="lang" value="ru" class="language-btn{% if lang == 'ru' %} selected{% endif %}">Русский</button>
        <button type="submit" name="lang" value="ur" class="language-btn{% if lang == 'ur' %} selected{% endif %}">اردو</button>
        <button type="submit" name="lang" value="other" class="language-btn muted{% if lang == 'other' %} selected{% endif %}">{{ t('other') }}</button>
      </div>

      {% include "_nav_continue.html" %}
    </form>
  </div>
</div>
