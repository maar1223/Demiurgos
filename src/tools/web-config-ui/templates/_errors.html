<!-- _errors.html — htmx fragment returned on test-connection or save errors -->
<!--
  Swaps itself into the hx-target. Uses Pico.css color tokens for
  error styling (red tones).
-->

<article class="connection-error" role="alert" aria-live="assertive">
  <header>
    <span>❌ Error</span>
    <button class="dismiss" aria-label="Cerrar" title="Cerrar"
            onclick="this.closest('article').remove()">✕</button>
  </header>
  <p>{{ error }}</p>
  <footer>
    <small>Verificá el endpoint, la API key y tu conexión a internet.</small>
  </footer>
</article>

<!-- Clear the model selects on error (out-of-band) -->
<select id="text-model" name="text_model" hx-swap-oob="true">
  <option value="">— Probá la conexión primero —</option>
</select>

<div id="vision-model-container" hx-swap-oob="true">
  <select id="vision-model" name="vision_model">
    <option value="">— Probá la conexión primero —</option>
  </select>
</div>
