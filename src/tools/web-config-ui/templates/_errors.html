<!-- _errors.html — htmx fragment returned on test-connection or save errors -->
<!--
  Swaps itself into the hx-target. Styled with custom design system tokens.
-->

<div class="connection-error" role="alert" aria-live="assertive">
  <div class="wizard-header">
    <svg class="icon icon-md"><use href="#alert-triangle"/></svg>
    <span>{{ t('error_title') }}</span>
    <button class="dismiss" aria-label="{{ t('error_dismiss_label') }}" title="{{ t('error_dismiss_label') }}"
            onclick="this.closest('.connection-error').remove()">✕</button>
  </div>
  <p>{{ error }}</p>
  <div class="wizard-footer">
    <span class="text-muted">{{ t('error_connection_hint') }}</span>
  </div>
</div>

<!-- Clear the model selects on error (out-of-band, standalone) -->
<select id="text-model" name="text_model" hx-swap-oob="true">
  <option value="">{{ t('error_test_first') }}</option>
</select>

<select id="vision-model" name="vision_model" hx-swap-oob="true">
  <option value="">{{ t('error_test_first') }}</option>
</select>

<div id="vision-model-container" hx-swap-oob="true"></div>
