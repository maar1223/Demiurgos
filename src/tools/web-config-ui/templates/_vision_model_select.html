<!-- _vision_model_select.html — htmx fragment for vision connection test only -->
<!--
  Swaps into #vision-connection-status and OOB-updates vision-model + vision-model-container.
  Models are tagged with vision capability indicators.
-->

<div class="connection-success" role="status">
  <div class="wizard-header">
    <svg class="icon icon-md"><use href="#check"/></svg>
    {{ t('connection_success_title') }}
  </div>
  <p>{{ t('vision_connection_success_detail', count=models|length) }}</p>
  <script>
    (function(el) {
      setTimeout(function() {
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 500);
      }, 5000);
    })(document.currentScript.parentElement);
  </script>
</div>

<select id="vision-model" name="vision_model" hx-swap-oob="true"
        onchange="var c=document.getElementById('vision-model-custom');if(c)c.style.display=this.value==='__other__'?'block':'none'">
  <option value="">{{ t('model_select_placeholder') }}</option>
  {% for m in models %}
  <option value="{{ m.id }}">{{ m.id }} {{ m.tag }}</option>
  {% endfor %}
  <option value="__other__">{{ t('model_custom_option') }}</option>
</select>

<div id="vision-model-container" hx-swap-oob="true">
  <span class="vision-ok text-muted">
    <svg class="icon icon-sm"><use href="#check"/></svg>
    {{ t('vision_supported_notice', count=models|length) }}
  </span>
</div>
