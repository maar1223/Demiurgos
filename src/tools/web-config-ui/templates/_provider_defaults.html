<!-- _provider_defaults.html — htmx fragment: endpoint + API key fields -->
<!-- Swaps into #provider-defaults when provider dropdown changes.
     Expects: current_text_endpoint, current_text_api_key -->

<div class="wizard-card">
  <label for="text-endpoint">{{ t('endpoint_label') }}</label>
  <input type="url"
         id="text-endpoint"
         name="text_endpoint"
         value="{{ current_text_endpoint or '' }}"
         placeholder="https://api.openai.com/v1"
         required>

  <label for="text-api-key">{{ t('api_key_label') }}</label>
  <input type="password"
         id="text-api-key"
         name="text_api_key"
         value="{{ current_text_api_key or '' }}"
         placeholder="sk-..."
         required>
</div>
