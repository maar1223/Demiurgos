<!-- _model_select.html — htmx fragment returned on successful connection test -->
<!--
  Swaps itself into the target (#connection-status) and uses
  hx-swap-oob to update text-model, vision-model, and vision-model-container.
  Models are tagged with vision capability: 👁️+✍️ (vision), ✍️ (text), ❓ (unknown).
-->

<!-- ===================================================================== -->
<!-- Connection status (inside the hx-target: #connection-status)            -->
<!-- ===================================================================== -->
<article class="connection-success" role="status" id="connection-status">
  <header>✅ {{ t('connection_success_title') }}</header>
  <p>{{ t('connection_success_detail', count=models|length) }}</p>
  <script>
    (function(el) {
      setTimeout(function() {
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 500);
      }, 5000);
    })(document.currentScript.parentElement);
  </script>
</article>

<!-- ===================================================================== -->
<!-- Populate text model select (out-of-band swap)                          -->
<!-- ===================================================================== -->
<select id="text-model" name="text_model" hx-swap-oob="true"
        onchange="var c=document.getElementById('text-model-custom');if(c)c.style.display=this.value==='__other__'?'block':'none'">
  <option value="">{{ t('model_select_placeholder') }}</option>
  {% for model in models %}
  <option value="{{ model.id }}"{% if model.id == current_text_model %} selected{% endif %}>
    {{ model.id }} {{ model.tag }}
  </option>
  {% endfor %}
  <option value="__other__">{{ t('model_custom_option') }}</option>
</select>

<!-- ===================================================================== -->
<!-- Populate vision model select (out-of-band swap, standalone)            -->
<!-- ===================================================================== -->
{% if supports_vision %}
<select id="vision-model" name="vision_model" hx-swap-oob="true"
        onchange="var c=document.getElementById('vision-model-custom');if(c)c.style.display=this.value==='__other__'?'block':'none'">
  <option value="">{{ t('model_select_placeholder') }}</option>
  {% for model in models %}
  <option value="{{ model.id }}"{% if model.id == current_vision_model %} selected{% endif %}>
    {{ model.id }} {{ model.tag }}
  </option>
  {% endfor %}
  <option value="__other__">{{ t('model_custom_option') }}</option>
</select>
{% endif %}

<!-- ===================================================================== -->
<!-- Vision status container (out-of-band swap, no nested select)           -->
<!-- ===================================================================== -->
<div id="vision-model-container" hx-swap-oob="true">
  {% if supports_vision %}
  <small class="vision-ok">✅ {{ t('vision_supported_notice', count=models|length) }}</small>
  {% else %}
  <small role="alert" class="vision-warning">
    ⚠️ {{ t('vision_not_supported_notice') }}
  </small>
  {% endif %}
</div>
