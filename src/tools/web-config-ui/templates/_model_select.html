<!-- _model_select.html — htmx fragment returned on successful connection test -->
<!--
  Swaps itself into the target (#connection-status) and uses
  hx-swap-oob to update the model selects and vision-model-container.
-->

<!-- ===================================================================== -->
<!-- Connection status (inside the hx-target: #connection-status)            -->
<!-- ===================================================================== -->
<article class="connection-success" role="status" id="connection-status">
  <header>✅ Conexión exitosa</header>
  <p>Se descubrieron <strong>{{ models | length }}</strong> modelos compatibles.</p>
  <script>
    (function(el) {
      setTimeout(function() {
        el.style.opacity = '0';
        setTimeout(function() { if (el.parentNode) el.remove(); }, 500);
      }, 5000);
    })(document.currentScript.parentElement);
  </script>
</article>

<!-- ===================================================================== -->
<!-- Populate text model select (out-of-band swap)                          -->
<!-- ===================================================================== -->
<select id="text-model" name="text_model" hx-swap-oob="true"
        onchange="var c=document.getElementById('text-model-custom');if(c)c.style.display=this.value==='__other__'?'block':'none'">
  <option value="">— Selecciona un modelo —</option>
  {% for model in models %}
  <option value="{{ model }}"{% if model == current_text_model %} selected{% endif %}>{{ model }}</option>
  {% endfor %}
  <option value="__other__">Otro (escribir manualmente)</option>
</select>

<!-- ===================================================================== -->
<!-- Vision model container (out-of-band swap)                              -->
<!-- ===================================================================== -->
<div id="vision-model-container" hx-swap-oob="true">
  {% if supports_vision %}
  <select id="vision-model" name="vision_model"
          onchange="var c=document.getElementById('vision-model-custom');if(c)c.style.display=this.value==='__other__'?'block':'none'">
    <option value="">— Selecciona un modelo —</option>
    {% for model in models %}
    <option value="{{ model }}"{% if model == current_vision_model %} selected{% endif %}>{{ model }}</option>
    {% endfor %}
    <option value="__other__">Otro (escribir manualmente)</option>
  </select>
  <small class="vision-ok">✅ Proveedor compatible con visión. Los modelos fueron cargados.</small>
  {% else %}
  <small role="alert" class="vision-warning">
    ⚠️ Este proveedor <strong>no soporta visión</strong>. La sección de proveedor de visión fue deshabilitada.
  </small>
  {% endif %}
</div>
