<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demiurgos — Wiki</title>
    <script>
      // Anti-FOUC: resolve the theme (localStorage > prefers-color-scheme)
      // and apply `.dark` on <html> before the first paint. Also swaps the
      // favicon (gray "D" in light, golden "D" in dark) to match. Standalone
      // by design — hooks/useTheme mirrors the same logic at runtime.
      (function () {
        try {
          var stored = localStorage.getItem("demiurgos-theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var favicon = document.querySelector('link[rel="icon"]');
          if (favicon) {
            favicon.href = dark ? "/favicon-dark.svg" : "/favicon-light.svg";
          }
        } catch (e) {
          // localStorage unavailable (blocked storage / file://) — the
          // default light theme and favicon stay in place.
        }
      })();
    </script>
    <script>
      // Anti-FOUC: apply the persisted locale to <html lang> before the first
      // paint, mirroring the theme script above. LocaleProvider seeds from the
      // same cache, so the first React render already matches. The static
      // lang="es" stays as the no-cache default.
      (function () {
        try {
          var raw = localStorage.getItem("demiurgos-locale");
          if (raw) {
            var locale = JSON.parse(raw);
            if (locale && (locale.ui === "es" || locale.ui === "en")) {
              document.documentElement.lang = locale.ui;
            }
          }
        } catch (e) {
          // corrupt/blocked storage — keep the static lang="es" default.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-surface text-primary font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
