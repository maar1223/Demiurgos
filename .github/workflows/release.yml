# S5a — release pipeline (design v2 S5-1..S5-5; tasks 7.1-7.7; PR 7)
#
# Tag-triggered publishing to the EXPLICIT public channel — never the implicit
# upstream (threat-matrix rows "Git repository selection" and "Push state").
#
# Sequencing (task 7.7 / gate 10): the publish step is TAG-GUARDED and INERT on
# branches. S5b has landed: the package cells audit the assembled stage before
# archiving (default-DENY + content scan), the publish job signs the merged
# SHA256SUMS with minisign (Author-owned key via secrets), and the post-publish
# smoke verifies signature + checksums before moving `latest`. The FIRST real
# vX.Y.Z tag is the Author's decision: the Author must run `minisign -G` (or
# `minisign -G -W` for an unprotected key), set secrets.MINISIGN_SECRET_KEY /
# MINISIGN_PUBKEY (and MINISIGN_KEY_PASSWORD for a protected key), and replace
# the placeholder MINISIGN_PUBKEY in install.sh / install.ps1 /
# scripts/install-demiurgos.sh / scripts/lib/verify_checksum.sh (S5b signing-key
# custody note). On a push to master (or a vX.Y.Z tag) this workflow is a dry
# run: the frontend is built once, packaged per OS (audit included), and the
# publish + smoke jobs are skipped. The packaging matrix is NOT run on pull
# requests (Actions-minute cost guard) — ci.yml is the PR gate.
#
# Support matrix mirrors decision #3579 (narrowed): Windows amd64; macOS >= 13
# arm64 (Apple Silicon); Linux x86_64 / aarch64 glibc >= 2.28. Intel macOS,
# musl/Alpine and glibc < 2.28 are NOT supported targets (the installer fails
# fast with a clear message; ci.yml keeps the documented expected-fail job).
#
# Harden (S5-4): every action is pinned by commit SHA (never a moving tag);
# `permissions: contents: read` at the workflow level; the publish token is
# scoped to the publish/smoke jobs only; no pull_request_target anywhere;
# publish bookkeeping never runs untrusted code with the token.

name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

# Single source of truth for the pinned uv toolchain. The publish job downloads
# these exact archives, hashes them into uv-shas.env, and the installer verifies
# its download against that signed table.
env:
  UV_VERSION: "0.5.24"

jobs:
  build-frontend:
    name: Build frontend (once)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Assert the release dist has no absolute API origin (S1-7)
        run: |
          pattern='https?://[A-Za-z0-9.-]+(:[0-9]+)?/api'
          if rg -n --no-messages "$pattern" frontend/dist; then
            echo "FAIL: the release bundle bakes an absolute API origin"
            echo "VITE_API_URL is a dev-only override (frontend/src/lib/constants.ts:3)"
            exit 1
          fi
          echo "OK: no absolute API origin in the built dist"
      - name: Upload the shared dist (single build reused by every package)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist
          path: frontend/dist

  package:
    name: Package (${{ matrix.cell }})
    needs: build-frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cell: linux-x86_64
            format: tar.gz
          - os: ubuntu-24.04-arm
            cell: linux-aarch64
            format: tar.gz
          - os: macos-15
            cell: macos-arm64
            format: tar.gz
          - os: windows-latest
            cell: windows-amd64
            format: zip
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the shared dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist
          path: dist
      - name: Assemble payload, checksums and archive (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cell="${{ matrix.cell }}"
          fmt="${{ matrix.format }}"
          archive="demiurgos-app-${version}-${cell}.${fmt}"
          stage="$RUNNER_TEMP/payload-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          # (1) the derived manifest allow-list (payload_manifest.json, S0-D)
          while IFS= read -r f; do
            [ -f "$f" ] || { echo "warn: manifest path missing: $f" >&2; continue; }
            mkdir -p "$stage/$(dirname "$f")"
            cp "$f" "$stage/$f"
          done < <(jq -r '.payload[]' payload_manifest.json)
          # (2) explicit extras (S5-1 artifact list): bootstraps, cores,
          #     launchers, requirements, LICENSE (task 8.3: every artifact).
          for f in install.sh install.ps1 start-api.ps1 \
                   start-gateway.ps1 scripts/start-demiurgos.sh \
                   scripts/install-demiurgos.sh scripts/install-demiurgos.ps1 \
                   scripts/provision-hermes.sh scripts/provision-hermes.ps1 \
                   scripts/collect-diagnostics.sh \
                   scripts/lib/verify_checksum.sh scripts/lib/verify_checksum.ps1 \
                   scripts/lib/desktop-shortcut.ps1 \
                   third-party/hermes/LICENSE \
                   desktop/Demiurgos.desktop \
                   "docs/Logos-Demiurgos/dorado/01_svg_dorado/letra-D-6tonos.svg" \
                   docs/Logos-Demiurgos/dorado/03_ico_dorado/demiurgos.ico \
                   requirements.lock requirements-optional.txt; do
            [ -f "$f" ] || { echo "warn: extra missing: $f" >&2; continue; }
            mkdir -p "$stage/$(dirname "$f")"
            cp "$f" "$stage/$f"
          done
          # AUD-03: the Windows launcher ships at the frozen layout path
          # (<current>/scripts/start-demiurgos.ps1, INSTALL_LAYOUT.md §1). The
          # dev checkout keeps it at the repo root; the installed tree does not.
          mkdir -p "$stage/scripts"
          cp start-demiurgos.ps1 "$stage/scripts/start-demiurgos.ps1"
          [ -f LICENSE ] || { echo "FAIL: LICENSE is missing; every artifact must carry it (task 8.3)"; exit 1; }
          cp LICENSE "$stage/LICENSE"
          # (3) the shared dist -> <stage>/frontend/dist (explicit artifact)
          dist_src="$(dirname "$(find dist -type f -name index.html | head -n1)")"
          mkdir -p "$stage/frontend/dist"
          cp -R "$dist_src/." "$stage/frontend/dist/"
          # (4) S5b gate (task 8.5): audit the assembled stage BEFORE
          #     packaging. default-DENY allow-list from payload_manifest.json
          #     + content scan; the explicit extras and the shared dist are
          #     declared via --allow (deny rules still win).
          cat > "$RUNNER_TEMP/payload-allow.txt" <<'ALLOW'
          install.sh
          install.ps1
          start-api.ps1
          start-gateway.ps1
          scripts/start-demiurgos.ps1
          scripts/start-demiurgos.sh
          scripts/install-demiurgos.sh
          scripts/install-demiurgos.ps1
          scripts/provision-hermes.sh
          scripts/provision-hermes.ps1
          scripts/collect-diagnostics.sh
          scripts/lib/verify_checksum.sh
          scripts/lib/verify_checksum.ps1
          scripts/lib/desktop-shortcut.ps1
          third-party/hermes/LICENSE
          desktop/Demiurgos.desktop
          docs/Logos-Demiurgos/dorado/01_svg_dorado/letra-D-6tonos.svg
          docs/Logos-Demiurgos/dorado/03_ico_dorado/demiurgos.ico
          requirements.lock
          requirements-optional.txt
          LICENSE
          frontend/dist/
          ALLOW
          bash scripts/payload_audit.sh --root "$stage" --manifest payload_manifest.json \
            --allow "$RUNNER_TEMP/payload-allow.txt" \
            --content-scan-skip frontend/dist/
          # (5) archive the payload tree (tar.gz for POSIX)
          tar -czf "$archive" -C "$stage" .
          # (6) per-OS checksum — plain sha256sum format ("hex  name"): the
          #     installer sha_for parsers match the name field exactly, so no
          #     binary-mode '*' marker may appear in the channel file. macOS
          #     does not ship sha256sum, so fall back to `shasum -a 256`,
          #     which prints the same two-space format.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "SHA256SUMS.${cell}"
          else
            shasum -a 256 "$archive" > "SHA256SUMS.${cell}"
          fi
          # (7) per-OS version record (publish merges into version.json)
          jq -n \
            --arg version "$version" \
            --arg cell "$cell" \
            --arg fmt "$fmt" \
            --arg artifact "$archive" \
            --arg sha "$(awk '{print $1}' "SHA256SUMS.${cell}")" \
            '{version: $version,
              artifacts: {($cell): {artifact: $artifact, format: $fmt, sha256: $sha}},
              floors: {windows: "10/11 x86_64",
                       macos: ">= 13 arm64 (Apple Silicon)",
                       linux: "glibc >= 2.28 (x86_64 / aarch64)"}}' \
            > "version-${cell}.json"
          # (8) self-check: exactly one dist tree and one checksum file per cell
          [ "$(find "$stage/frontend/dist" -type f | wc -l)" -gt 0 ] \
            || { echo "FAIL: empty dist in the payload"; exit 1; }
          echo "packaged: $archive ($(du -h "$archive" | cut -f1))"
      - name: Assemble payload, checksums and archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $cell = "${{ matrix.cell }}"
          $fmt = "${{ matrix.format }}"
          $archive = "demiurgos-app-$version-$cell.$fmt"
          $stage = Join-Path $env:RUNNER_TEMP 'payload-stage'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # (1) the derived manifest allow-list
          $manifest = Get-Content -Raw payload_manifest.json | ConvertFrom-Json
          foreach ($f in $manifest.payload) {
            if (-not (Test-Path $f)) { Write-Warning "manifest path missing: $f"; continue }
            $dest = Join-Path $stage $f
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item -LiteralPath $f -Destination $dest
          }
          # (2) explicit extras (S5-1 artifact list)
          $extras = @(
            'install.sh', 'install.ps1', 'start-api.ps1',
            'start-gateway.ps1', 'scripts/start-demiurgos.sh',
            'scripts/install-demiurgos.sh', 'scripts/install-demiurgos.ps1',
            'scripts/provision-hermes.sh', 'scripts/provision-hermes.ps1',
            'scripts/collect-diagnostics.sh',
            'scripts/lib/verify_checksum.sh', 'scripts/lib/verify_checksum.ps1',
            'scripts/lib/desktop-shortcut.ps1',
            'third-party/hermes/LICENSE',
            'desktop/Demiurgos.desktop',
            'docs/Logos-Demiurgos/dorado/01_svg_dorado/letra-D-6tonos.svg',
            'docs/Logos-Demiurgos/dorado/03_ico_dorado/demiurgos.ico',
            'requirements.lock', 'requirements-optional.txt'
          )
          foreach ($f in $extras) {
            if (-not (Test-Path $f)) { Write-Warning "extra missing: $f"; continue }
            $dest = Join-Path $stage $f
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item -LiteralPath $f -Destination $dest
          }
          # AUD-03: the Windows launcher ships at the frozen layout path
          # (<current>\scripts\start-demiurgos.ps1, INSTALL_LAYOUT.md §1). The
          # dev checkout keeps it at the repo root; the installed tree does not.
          $launcherDest = Join-Path $stage 'scripts/start-demiurgos.ps1'
          New-Item -ItemType Directory -Force -Path (Split-Path $launcherDest) | Out-Null
          Copy-Item -LiteralPath 'start-demiurgos.ps1' -Destination $launcherDest
          if (-not (Test-Path LICENSE)) { throw 'FAIL: LICENSE is missing; every artifact must carry it (task 8.3)' }
          Copy-Item LICENSE (Join-Path $stage 'LICENSE')
          # (3) the shared dist -> <stage>/frontend/dist
          $distFile = Get-ChildItem -Path dist -Recurse -Filter index.html | Select-Object -First 1
          $distSrc = Split-Path -Parent $distFile.FullName
          $distDest = Join-Path $stage 'frontend/dist'
          New-Item -ItemType Directory -Force -Path $distDest | Out-Null
          Copy-Item -Path (Join-Path $distSrc '*') -Destination $distDest -Recurse -Force
          # (4) S5b gate (task 8.5): audit the assembled stage BEFORE
          #     packaging (Windows parity of payload_audit.sh, task 8.2).
          $allowFile = Join-Path $env:RUNNER_TEMP 'payload-allow.txt'
          @(
            'install.sh', 'install.ps1', 'start-api.ps1',
            'start-gateway.ps1', 'scripts/start-demiurgos.ps1',
            'scripts/start-demiurgos.sh',
            'scripts/install-demiurgos.sh', 'scripts/install-demiurgos.ps1',
            'scripts/provision-hermes.sh', 'scripts/provision-hermes.ps1',
            'scripts/collect-diagnostics.sh',
            'scripts/lib/verify_checksum.sh', 'scripts/lib/verify_checksum.ps1',
            'scripts/lib/desktop-shortcut.ps1',
            'third-party/hermes/LICENSE',
            'desktop/Demiurgos.desktop',
            'docs/Logos-Demiurgos/dorado/01_svg_dorado/letra-D-6tonos.svg',
            'docs/Logos-Demiurgos/dorado/03_ico_dorado/demiurgos.ico',
            'requirements.lock', 'requirements-optional.txt', 'LICENSE',
            'frontend/dist/'
          ) | Set-Content -Encoding ascii $allowFile
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/payload_audit.ps1 `
            -Root $stage -Manifest payload_manifest.json -Allow $allowFile `
            -ContentScanSkip 'frontend/dist/'
          if ($LASTEXITCODE -ne 0) { throw "payload audit failed (exit $LASTEXITCODE)" }
          # (5) archive the payload tree (zip)
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive
          # (6) per-OS checksum in plain sha256sum format: "<hex>  <name>"
          $h = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$h  $archive" | Set-Content -Encoding ascii "SHA256SUMS.$cell"
          # (7) per-OS version record
          $record = @{
            version  = $version
            artifacts = @{ $cell = @{ artifact = $archive; format = $fmt; sha256 = $h } }
            floors   = @{
              windows = '10/11 x86_64'
              macos   = '>= 13 arm64 (Apple Silicon)'
              linux   = 'glibc >= 2.28 (x86_64 / aarch64)'
            }
          }
          $record | ConvertTo-Json -Depth 5 | Set-Content -Encoding ascii "version-$cell.json"
      - name: Upload the packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-${{ matrix.cell }}
          path: |
            demiurgos-app-*
            SHA256SUMS.${{ matrix.cell }}
            version-${{ matrix.cell }}.json

  windows-payload-boot:
    # AUD-16: boot the REAL packaged Windows payload (the shipped zip), not a
    # fabricated layout. Runs on every push to master (dry run) and on tags;
    # it never publishes. The launcher needs <appRoot>\.venv, so provision the
    # hash-locked requirements first, exactly like the installer does.
    name: Windows payload boot
    needs: package
    runs-on: windows-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Download the packaged Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package-windows-amd64
          path: package

      - name: Extract the packaged payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem package -Filter 'demiurgos-app-*-windows-amd64.zip' |
            Select-Object -First 1
          if (-not $zip) { throw 'no Windows payload archive found' }
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath payload

      - name: Provision the payload venv (wheels-only, hash-locked)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'payload\requirements.lock')) {
            throw 'packaged payload is missing requirements.lock'
          }
          uv venv payload\.venv --python 3.12
          uv pip install --python payload\.venv\Scripts\python.exe `
            --only-binary=:all: -r payload\requirements.lock

      - name: Boot the packaged payload and check /health
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $port = 18000
          $env:DEMIURGOS_HOME = Join-Path $env:RUNNER_TEMP 'boot-install'
          $env:DEMIURGOS_DATA_ROOT = Join-Path $env:RUNNER_TEMP 'boot-data'
          $env:DEMIURGOS_API_PORT = "$port"
          $env:DEMIURGOS_NO_BROWSER = '1'
          $launcher = Join-Path (Resolve-Path payload) 'scripts\start-demiurgos.ps1'
          if (-not (Test-Path $launcher)) { throw "packaged launcher missing: $launcher" }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher start
          if ($LASTEXITCODE -ne 0) { throw "launcher start failed (exit $LASTEXITCODE)" }

          $ready = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 `
                  "http://127.0.0.1:$port/health"
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) {
              Write-Host '--- payload logs (boot failure) ---'
              $logRoot = Join-Path $env:DEMIURGOS_HOME 'logs'
              Get-ChildItem -Recurse -File $logRoot -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "### $($_.FullName)"; Get-Content $_.FullName }
              throw 'packaged payload never served /health'
            }
            $root = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 `
              "http://127.0.0.1:$port/"
            if ($root.StatusCode -ne 200) {
              throw "packaged payload / returned $($root.StatusCode)"
            }
            Write-Host "OK: packaged Windows payload booted and served /health + / on $port"
          } finally {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher stop
          }

  publish:
    name: Publish to the public channel
    needs: package
    # TAG GUARD (task 7.5 / 7.7): inert on branches — the dry run never
    # publishes, and no vX.Y.Z tag is pushed until S5b has landed (gate 10).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download every packaged artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: package-*
          merge-multiple: true
      - name: Classify the release (Beta gate)
        run: |
          set -euo pipefail
          # The tag is the single authority: a prerelease iff its version core
          # carries a '-' suffix (v0.x.y-beta.N -> 1; v0.x.y -> 0). The pointer
          # name follows from the classification, never from an input.
          tag="${GITHUB_REF_NAME}"; core="${tag#v}"
          if printf '%s' "$core" | grep -q '-'; then is_prerelease=1; else is_prerelease=0; fi
          pointer="latest"; [ "$is_prerelease" = "1" ] && pointer="latest-beta"
          printf 'is_prerelease=%s\n' "$is_prerelease" >> "$GITHUB_ENV"
          printf 'pointer=%s\n' "$pointer" >> "$GITHUB_ENV"
          echo "release ${tag}: is_prerelease=${is_prerelease} pointer=${pointer}"
      - name: Assemble the channel tree
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          public_repo="maar12""23/demiurgos-releases"
          # Clone the LIVE channel branch so the publish is additive: previous
          # payloads and the OTHER channel's pointer survive untouched. The
          # pointer itself is only moved by the post-smoke pointer job.
          rm -rf channel
          gh auth setup-git
          git clone --depth 1 "https://github.com/${public_repo}.git" channel
          mkdir -p channel/scripts/lib channel/uv
          for f in install.sh install.ps1 \
                   scripts/install-demiurgos.sh scripts/install-demiurgos.ps1 \
                   scripts/lib/verify_checksum.sh scripts/lib/verify_checksum.ps1 \
                   scripts/provision-hermes.sh scripts/provision-hermes.ps1; do
            cp "$f" "channel/$f"
          done
          # the four packaged payloads (one per supported cell)
          cp demiurgos-app-* channel/
          # the four pinned uv archives the installer can ask for
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        aarch64-apple-darwin x86_64-pc-windows-msvc; do
            ext=tar.gz; case "$target" in *windows*) ext=zip ;; esac
            curl -fsSL --proto '=https' --retry 3 --max-time 300 \
              -o "channel/uv/uv-${target}-${UV_VERSION}.${ext}" \
              "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${target}.${ext}"
          done
          # uv-shas.env: one line per supported target, keyed exactly like the
          # installer's env contract. The installer verifies this file against
          # the signed SHA256SUMS before trusting any value.
          {
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                          aarch64-apple-darwin x86_64-pc-windows-msvc; do
              ext=tar.gz; case "$target" in *windows*) ext=zip ;; esac
              # Keys match the installer env contract exactly (no "unknown").
              case "$target" in
                x86_64-unknown-linux-gnu) key=UV_SHA_X86_64_LINUX_GNU ;;
                aarch64-unknown-linux-gnu) key=UV_SHA_AARCH64_LINUX_GNU ;;
                aarch64-apple-darwin) key=UV_SHA_AARCH64_DARWIN ;;
                x86_64-pc-windows-msvc) key=UV_SHA_X86_64_WINDOWS_MSVC ;;
              esac
              printf '%s=%s\n' "$key" \
                "$(sha256sum "channel/uv/uv-${target}-${UV_VERSION}.${ext}" | awk '{print $1}')"
            done
          } > channel/uv-shas.env
          # installer contract: version.json carries `posix` and `windows`
          jq -s '
            reduce .[] as $x ({}; .version = $x.version
                                | .artifacts += $x.artifacts
                                | .floors = $x.floors)
            | .posix   = (.artifacts["linux-x86_64"].artifact // "")
            | .windows = (.artifacts["windows-amd64"].artifact // "")
            | .sha256  = {posix:   (.artifacts["linux-x86_64"].sha256 // ""),
                          windows: (.artifacts["windows-amd64"].sha256 // "")}
          ' version-*.json > channel/version.json
          echo "channel tree:"; find channel -maxdepth 2 -type f | sort
      - name: Sign the channel manifest (minisign; Author-owned key, S5b)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBKEY: ${{ secrets.MINISIGN_PUBKEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq minisign
          fi
          if [ -z "${MINISIGN_SECRET_KEY:-}" ] || [ -z "${MINISIGN_PUBKEY:-}" ]; then
            echo "FAIL: secrets.MINISIGN_SECRET_KEY / MINISIGN_PUBKEY are not set."
            echo "The Author must run 'minisign -G' locally and set both secrets"
            echo "(S5b signing-key custody note), then replace the placeholder"
            echo "MINISIGN_PUBKEY in install.sh, install.ps1,"
            echo "scripts/install-demiurgos.sh and scripts/lib/verify_checksum.sh."
            exit 1
          fi
          cd channel
          # Regenerate over the WHOLE channel tree so uv-shas.env, the scripts
          # and any payload from an older release stay listed and verifiable.
          # '%P' yields names without './', exactly what the installer's
          # sha_for parser matches. The manifest and its signature are excluded.
          # The pointers are excluded: they move AFTER signing in the pointer
          # job, so listing them here would leave a stale manifest on the
          # branch. They carry only a version string and are never fetch-verified.
          find . -path ./.git -prune -o -type f \
            ! -name SHA256SUMS ! -name SHA256SUMS.minisig \
            ! -name latest ! -name latest-beta -printf '%P\0' \
            | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS >/dev/null
          keyfile="$RUNNER_TEMP/minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
          # Password-protected keys are supported via MINISIGN_KEY_PASSWORD;
          # `minisign -G -W` keys have none and sign without a prompt.
          if [ -n "${MINISIGN_KEY_PASSWORD:-}" ]; then
            printf '%s\n' "$MINISIGN_KEY_PASSWORD" | minisign -Sm SHA256SUMS -s "$keyfile"
          else
            minisign -Sm SHA256SUMS -s "$keyfile"
          fi
          rm -f "$keyfile"
          # fail-closed self-check: the signed manifest must verify with the
          # public key (the RWS... line; a full .pub file is tolerated too)
          pubkey="$(printf '%s\n' "$MINISIGN_PUBKEY" | tail -n1)"
          minisign -Vm SHA256SUMS -P "$pubkey" >/dev/null \
            || { echo "FAIL: self-check signature verification failed"; exit 1; }
          echo "manifest signed: SHA256SUMS.minisig ($(wc -l < SHA256SUMS) entries)"
      - name: Push the channel tree to the branch
        run: |
          set -euo pipefail
          # The tree is additive and the pointer is NOT touched here: a broken
          # artifact can never become the default before the smoke passes.
          cd channel
          git config user.name "demiurgos-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "channel tree unchanged"
          else
            git commit -m "channel: ${GITHUB_REF_NAME}"
            git push origin HEAD:main
            echo "channel tree pushed to main"
          fi
      - name: Publish the release (explicit repo, explicit tag, Beta gate)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"    # vX.Y.Z — explicit tag, never implicit
          # public channel; owner/name is the Author's pending decision (S0-E);
          # built from parts so no address appears verbatim (mirrors install.sh)
          public_repo="maar12""23/demiurgos-releases"
          prerelease_flag=""
          [ "$is_prerelease" = "1" ] && prerelease_flag="--prerelease"
          cd channel
          gh release create --repo "$public_repo" "$tag" \
            demiurgos-app-* SHA256SUMS SHA256SUMS.minisig version.json uv-shas.env \
            scripts/install-demiurgos.sh scripts/install-demiurgos.ps1 \
            scripts/lib/verify_checksum.sh scripts/lib/verify_checksum.ps1 \
            install.sh install.ps1 \
            $prerelease_flag \
            --title "Demiurgos ${tag}" \
            --notes "Versioned artifact release for the one-command install flow. The channel tree lives on the public branch (raw.githubusercontent.com/maar1223/demiurgos-releases/main); this release mirrors the same artifacts for traceability. SHA256SUMS is minisign-signed (SHA256SUMS.minisig) and covers uv-shas.env, the scripts and every payload. The anonymous post-publish smoke installs from the public branch and gates the channel pointer (stable: latest; beta: latest-beta; S5-5, S0)."

  smoke:
    name: Post-publish anonymous smoke (public raw channel)
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Classify the release (Beta gate)
        run: |
          set -euo pipefail
          # Same inline classifier as the publish job: the tag is the single
          # authority, recomputed here (no cross-job outputs). Exported to
          # $GITHUB_ENV so the later pointer/gating steps see one decision.
          tag="${GITHUB_REF_NAME}"; core="${tag#v}"
          if printf '%s' "$core" | grep -q '-'; then is_prerelease=1; else is_prerelease=0; fi
          printf 'is_prerelease=%s\n' "$is_prerelease" >> "$GITHUB_ENV"
          echo "release ${tag}: is_prerelease=${is_prerelease}"
      - name: Install minisign (the consumer verifies the signed manifest)
        run: |
          set -euo pipefail
          # The bootstrap refuses to install without minisign: the published
          # manifest signature is verified before any checksum is trusted. This
          # step is the runner-side prerequisite, not a test shim.
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq minisign
          fi
          minisign -v 2>&1 | head -2 || true
      - name: Install into a clean environment and boot from the real channel
        env:
          MINISIGN_PUBKEY: ${{ secrets.MINISIGN_PUBKEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          public_repo="maar12""23/demiurgos-releases"
          # The REAL public channel: a raw branch root, not a fabricated
          # file:// fixture. Every fetch below is the one a user's machine
          # performs, and uv is verified through the channel's signed
          # uv-shas.env (no DEMIURGOS_UV_SHA256 override).
          base="https://raw.githubusercontent.com/${public_repo}/main"
          if [ -z "${MINISIGN_PUBKEY:-}" ]; then
            echo "FAIL: secrets.MINISIGN_PUBKEY is not set (S5b signing-key custody note)"
            exit 1
          fi
          # the bootstrap's embedded pubkey seam: the real key from secrets
          export MINISIGN_PUBKEY="$(printf '%s\n' "$MINISIGN_PUBKEY" | tail -n1)"
          curl -fsSL --proto '=https' --retry 3 --max-time 120 \
            -o install.sh "${base}/install.sh"
          # headless guard: no-op browser stubs on PATH (same as the payload boot)
          mkdir -p "$RUNNER_TEMP/noop-browser/bin"
          for n in xdg-open open gio sensible-browser x-www-browser; do
            printf '#!/bin/sh\necho "noop %s" >> "$RUNNER_TEMP/noop-browser/calls.log"\nexit 0\n' "$n" \
              > "$RUNNER_TEMP/noop-browser/bin/$n"
            chmod +x "$RUNNER_TEMP/noop-browser/bin/$n"
          done
          export PATH="$RUNNER_TEMP/noop-browser/bin:$PATH"
          export DEMIURGOS_HOME="$RUNNER_TEMP/dem-install"
          export DEMIURGOS_DATA_ROOT="$RUNNER_TEMP/dem-data"
          export DEMIURGOS_URL_BASE="$base"
          export DEMIURGOS_VERSION="$version"
          export DEMIURGOS_NO_BROWSER=1
          export DEMIURGOS_API_PORT=8123
          bash install.sh
          bash "$DEMIURGOS_HOME/current/scripts/start-demiurgos.sh" start
          trap 'bash "$DEMIURGOS_HOME/current/scripts/start-demiurgos.sh" stop >/dev/null 2>&1 || true' EXIT
          ok=0
          for _ in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8123/health" || true)"
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 1
          done
          [ "$ok" = "1" ] || { echo "FAIL: /health never became 200"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8123/")" = "200" ] \
            || { echo "FAIL: / did not serve 200"; exit 1; }
          echo "smoke OK: /health and / serve 200 from the public raw channel"

  pointer:
    name: Move the channel pointer (only after the smoke passed)
    needs: smoke
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - name: Classify the release (Beta gate)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"; core="${tag#v}"
          if printf '%s' "$core" | grep -q '-'; then is_prerelease=1; else is_prerelease=0; fi
          pointer="latest"; [ "$is_prerelease" = "1" ] && pointer="latest-beta"
          printf 'is_prerelease=%s\n' "$is_prerelease" >> "$GITHUB_ENV"
          printf 'pointer=%s\n' "$pointer" >> "$GITHUB_ENV"
          echo "release ${tag}: is_prerelease=${is_prerelease} pointer=${pointer}"
      - name: Move the pointer on the channel branch
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          public_repo="maar12""23/demiurgos-releases"
          rm -rf channel
          gh auth setup-git
          git clone --depth 1 "https://github.com/${public_repo}.git" channel
          cd channel
          printf '%s\n' "$version" > "$pointer"
          git config user.name "demiurgos-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add "$pointer"
          if git diff --cached --quiet; then
            echo "${pointer} already points to ${version}"
          else
            git commit -m "channel: ${pointer} -> ${version}"
            git push origin HEAD:main
          fi
          echo "${pointer} pointer moved to ${version}"
      - name: Assert the pointer gating (stable latest / beta latest-beta)
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          public_repo="maar12""23/demiurgos-releases"
          base="https://raw.githubusercontent.com/${public_repo}/main"
          # (1) the created GitHub release must be marked prerelease iff the tag
          #     was classified as one; a mismatch is a hard failure.
          actual="$(gh release view "$tag" --repo "$public_repo" --json isPrerelease -q .isPrerelease)"
          expected=false; [ "$is_prerelease" = "1" ] && expected=true
          [ "$actual" = "$expected" ] \
            || { echo "FAIL: isPrerelease=${actual}, expected ${expected}"; exit 1; }
          # (2) the branch pointer, read back anonymously. Raw responses are
          #     CDN-cached briefly, so poll until the expected value appears.
          wait_pointer() { # pointer expected
            local got=""
            for _ in $(seq 1 24); do
              got="$(curl -fsSL --proto '=https' --retry 2 --max-time 60 \
                -H 'Cache-Control: no-cache' "${base}/$1?run=${GITHUB_RUN_ID}" 2>/dev/null || true)"
              [ "$got" = "$2" ] && { printf '%s' "$got"; return 0; }
              sleep 5
            done
            printf '%s' "$got"
            return 1
          }
          if [ "$is_prerelease" = "1" ]; then
            stable="$(curl -fsSL --proto '=https' --retry 3 --max-time 60 \
              -H 'Cache-Control: no-cache' "${base}/latest?run=${GITHUB_RUN_ID}" 2>/dev/null || true)"
            [ "$stable" != "$version" ] \
              || { echo "FAIL: a prerelease moved the latest pointer"; exit 1; }
            got="$(wait_pointer latest-beta "$version")" \
              || { echo "FAIL: latest-beta=${got}, expected ${version}"; exit 1; }
            echo "beta gating OK: latest=${stable} untouched, latest-beta=${version}"
          else
            got="$(wait_pointer latest "$version")" \
              || { echo "FAIL: latest=${got}, expected ${version}"; exit 1; }
            echo "stable gating OK: latest=${version}"
          fi