name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cost guard: keep a single in-flight run per ref. A newer push cancels the
# older run for the same ref so back-to-back pushes never stack Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Task 7.4 — wheels-only uv matrix (no setup-python, no bare pip),
    # mirroring the narrowed support matrix (decision #3579):
    # Windows amd64; macOS >= 13 arm64; Linux x86_64 / aarch64 glibc >= 2.28.
    name: Backend wheels-only (${{ matrix.cell }})
    # The suite includes the POSIX Hermes-absent boot cell, which serves the
    # built SPA at "/" (the launcher hardcodes <app-root>/frontend/dist), so the
    # built dist is downloaded into frontend/dist before the tests run.
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cell: linux-x86_64-glibc
            venv_python: .venv/bin/python
          - os: ubuntu-24.04-arm
            cell: linux-aarch64-glibc
            venv_python: .venv/bin/python
          - os: macos-14
            cell: macos-arm64
            venv_python: .venv/bin/python
          - os: windows-latest
            cell: windows-amd64
            venv_python: .venv/Scripts/python.exe
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv (wheels-only; no setup-python, no bare pip)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Provision the no-op browser stubs (headless guard)
        # The suite runs the launcher boot/rollback cells too; their harnesses
        # fail loudly if the no-op browser stubs are absent (s2b-harness-gotcha
        # — a real browser must never open from a test). Provision them up-front
        # so the cells do not depend on another test file having created them.
        shell: bash
        run: |
          mkdir -p /tmp/opencode/noop-browser/bin
          for n in xdg-open open gio sensible-browser x-www-browser; do
            if [ ! -x "/tmp/opencode/noop-browser/bin/$n" ]; then
              printf '#!/bin/sh\necho "noop %s" >> /tmp/opencode/noop-browser/calls.log\nexit 0\n' "$n" \
                > "/tmp/opencode/noop-browser/bin/$n"
              chmod +x "/tmp/opencode/noop-browser/bin/$n"
            fi
          done

      - name: Create the wheels-only venv
        shell: bash
        run: |
          uv venv .venv --python 3.12
          uv pip install --python "${{ matrix.venv_python }}" --only-binary=:all: \
            -r src/tools/demiurgos-suite/requirements.txt pytest

      - name: Closure proof (wheels-only dry-run for this cell)
        shell: bash
        run: bash scripts/closure_proof.sh --target "${{ matrix.cell }}" --json

      - name: Download the built frontend dist (the boot cell serves "/" from it)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist-ubuntu-latest
          path: frontend/dist

      - name: Run backend tests (exclude live-Hermes e2e)
        env:
          DEMIURGOS_AUTH_MODE: local-dev
        shell: bash
        run: |
          # The launcher and installer CONTRACT suites shell out to bash /
          # powershell / the POSIX installer and are covered by their dedicated
          # jobs (launcher: ubuntu+macos+windows; installer-smoke: POSIX;
          # ps51: Windows cells). Running them again here was the source of the
          # cross-platform red: on macOS the unsigned fixture uv fails the
          # installer's codesign gate and the shasum shim assumes sha256sum; on
          # Windows the cells invoke the WSL bash stub and can hang. Keep the
          # backend matrix on the backend suite.
          "${{ matrix.venv_python }}" -m pytest src/tools/demiurgos-suite/wiki/tests/ \
            --ignore=src/tools/demiurgos-suite/wiki/tests/test_semantic_e2e.py \
            --ignore=src/tools/demiurgos-suite/wiki/tests/test_import_enrichment_e2e.py \
            --ignore=src/tools/demiurgos-suite/wiki/tests/test_installer_contract.py \
            --ignore=src/tools/demiurgos-suite/wiki/tests/test_launcher_portable.py \
            --ignore=src/tools/demiurgos-suite/wiki/tests/test_launcher_root_propagation.py \
            --ignore=src/tools/demiurgos-suite/wiki/tests/test_launcher_boot_smoke.py \
            -k "not live" -q

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Upload the built dist (explicit artifact for the static-serving job)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-dist-ubuntu-latest
          path: frontend/dist

  static-serving:
    # Task 7.4 — hermetic static-serving step with the built dist as an
    # explicit artifact input (S1-9). The conftest autouse fixture keeps the
    # built dist out of the general backend suite (S1-4); this job runs the
    # focused suite and the same-origin guard (S1-7) against the real build.
    name: Static serving (built dist artifact)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download the built dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist-ubuntu-latest
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Create the wheels-only venv
        shell: bash
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python --only-binary=:all: \
            -r src/tools/demiurgos-suite/requirements.txt pytest

      - name: Assert the built dist has no absolute API origin (S1-7)
        shell: bash
        run: |
          pattern='https?://[A-Za-z0-9.-]+(:[0-9]+)?/api'
          dist_src="$(dirname "$(find dist -type f -name index.html | head -n1)")"
          if rg -n --no-messages "$pattern" "$dist_src"; then
            echo "FAIL: the built dist bakes an absolute API origin"
            exit 1
          fi
          echo "OK: no absolute API origin in the built dist"

      - name: Run the hermetic static-serving suite
        shell: bash
        run: |
          .venv/bin/python -m pytest \
            src/tools/demiurgos-suite/wiki/tests/test_static_app_serving.py -q

  launcher:
    # Task 7.4 — launcher behaviour matrix on ubuntu / macOS arm64 / Windows.
    name: Launcher (${{ matrix.os }})
    # The POSIX Hermes-absent boot cell serves the built SPA at "/": the launcher
    # hardcodes DEMIURGOS_FRONTEND_DIST="$APP_ROOT/frontend/dist", so the built
    # dist (from the frontend job) is downloaded into frontend/dist first.
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            venv_python: .venv/bin/python
            launcher_files: >-
              src/tools/demiurgos-suite/wiki/tests/test_launcher_portable.py
              src/tools/demiurgos-suite/wiki/tests/test_launcher_root_propagation.py
              src/tools/demiurgos-suite/wiki/tests/test_launcher_boot_smoke.py
          - os: macos-14
            venv_python: .venv/bin/python
            launcher_files: >-
              src/tools/demiurgos-suite/wiki/tests/test_launcher_portable.py
              src/tools/demiurgos-suite/wiki/tests/test_launcher_root_propagation.py
              src/tools/demiurgos-suite/wiki/tests/test_launcher_boot_smoke.py
          - os: windows-latest
            # The PS boot smoke runs in the ps51 job; the windows stub-matrix
            # placeholder is CI-job-driven (it pytest.fails by design), so the
            # windows cell here runs the contract suites only.
            venv_python: .venv/Scripts/python.exe
            launcher_files: >-
              src/tools/demiurgos-suite/wiki/tests/test_launcher_portable.py
              src/tools/demiurgos-suite/wiki/tests/test_launcher_root_propagation.py
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Create the wheels-only venv
        shell: bash
        run: |
          uv venv .venv --python 3.12
          uv pip install --python "${{ matrix.venv_python }}" --only-binary=:all: \
            -r src/tools/demiurgos-suite/requirements.txt pytest

      - name: Provision the no-op browser stubs (headless guard)
        shell: bash
        run: |
          mkdir -p /tmp/opencode/noop-browser/bin
          for n in xdg-open open gio sensible-browser x-www-browser; do
            if [ ! -x "/tmp/opencode/noop-browser/bin/$n" ]; then
              printf '#!/bin/sh\necho "noop %s" >> /tmp/opencode/noop-browser/calls.log\nexit 0\n' "$n" \
                > "/tmp/opencode/noop-browser/bin/$n"
              chmod +x "/tmp/opencode/noop-browser/bin/$n"
            fi
          done

      - name: Download the built frontend dist (the boot cell serves "/" from it)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist-ubuntu-latest
          path: frontend/dist

      - name: Run the launcher suites
        shell: bash
        run: |
          "${{ matrix.venv_python }}" -m pytest ${{ matrix.launcher_files }} -q

  installer-smoke:
    # Task 7.4 — installer smoke against a local file:// fixture channel.
    name: Installer smoke (file:// fixture)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Create the wheels-only venv (the fixture's stub python)
        shell: bash
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python --only-binary=:all: \
            -r src/tools/demiurgos-suite/requirements.txt pytest

      - name: Install minisign (signed-channel fixture cells, S5b)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

      - name: Run the installer contract suite (file:// fixture cells)
        shell: bash
        run: |
          .venv/bin/python -m pytest \
            src/tools/demiurgos-suite/wiki/tests/test_installer_contract.py -q

  installer-musl-expected-fail:
    # Decision #3579: musl/Alpine is NOT a supported target. This job keeps the
    # documented expected-fail: the installer must fail fast with a clear
    # message on real Alpine — proving the unsupported path, not reporting it
    # as a supported target.
    name: Installer musl/Alpine expected-fail (documented)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prove the installer fails fast on musl (decision #3579)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e DEMIURGOS_HOME=/tmp/dem-musl-home \
            -e DEMIURGOS_VERSION=0.0.0 \
            -e DEMIURGOS_URL_BASE=https://example.invalid/demiurgos \
            alpine:3.20 sh -c '
              apk add --no-cache bash coreutils curl >/dev/null 2>&1
              bash scripts/install-demiurgos.sh > /tmp/installer.out 2>&1
              rc=$?
              echo "installer exit code: $rc"
              cat /tmp/installer.out
              [ "$rc" -ne 0 ] || { echo "FAIL: installer unexpectedly succeeded on musl"; exit 1; }
              grep -qi "musl" /tmp/installer.out \
                || { echo "FAIL: expected musl fail-fast message missing"; exit 1; }
              echo "PASS: musl/Alpine fails fast with a clear message (unsupported target)"
            '

  ps51:
    # Task 7.4 — dedicated PowerShell 5.1 job: powershell.exe -NoProfile -File
    # is exercised by the Windows installer cells and the PS launcher boot
    # smoke, and every shipped .ps1 is parse-checked under powershell.exe.
    name: PowerShell 5.1 contract (windows)
    # The Windows PS 5.1 boot-smoke cell serves the built SPA at "/" (the
    # launcher hardcodes <app-root>/frontend/dist), so the built dist is
    # downloaded here too.
    needs: frontend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Create the wheels-only venv (the fixture's stub python)
        shell: bash
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/Scripts/python.exe --only-binary=:all: \
            -r src/tools/demiurgos-suite/requirements.txt pytest

      - name: PS 5.1 parse check of every shipped script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @(
            'install.ps1', 'start-demiurgos.ps1', 'start-api.ps1',
            'start-gateway.ps1', 'scripts/install-demiurgos.ps1',
            'scripts/lib/verify_checksum.ps1', 'scripts/lib/desktop-shortcut.ps1',
            'scripts/install-cli-stack.ps1'
          )) {
            [scriptblock]::Create((Get-Content -Raw -LiteralPath $f)) | Out-Null
          }
          Write-Output 'PS 5.1 parse OK'

      - name: Desktop shortcut contract (real .lnk on Windows)
        # The lib is the single owner of the Windows desktop-integration rule:
        # the Start Menu entry is automatic, the Desktop icon is opt-in. This
        # cell executes it for real and reads the written .lnk back through
        # WScript.Shell, so the target/arguments/icon contract cannot drift.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'desktop-shortcut'
          if (Test-Path $base) { Remove-Item -Recurse -Force $base }
          $programs = Join-Path $base 'Programs'
          $desktop = Join-Path $base 'Desktop'
          New-Item -ItemType Directory -Force -Path $desktop | Out-Null
          . ./scripts/lib/desktop-shortcut.ps1

          $startMenuOnly = Install-DemiurgosShortcuts -AppRoot $PWD.Path `
            -ProgramsDirectory $programs -DesktopDirectory $desktop
          if (@($startMenuOnly).Count -ne 1) {
            throw "expected one shortcut without -Desktop, got $(@($startMenuOnly).Count)"
          }
          if (Test-Path (Join-Path $desktop 'Demiurgos.lnk')) {
            throw 'the desktop icon must stay opt-in'
          }

          $both = Install-DemiurgosShortcuts -AppRoot $PWD.Path -Desktop `
            -ProgramsDirectory $programs -DesktopDirectory $desktop
          if (@($both).Count -ne 2) {
            throw "expected two shortcuts with -Desktop, got $(@($both).Count)"
          }

          $lnk = Join-Path $desktop 'Demiurgos.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) { throw 'the desktop shortcut was not written' }
          $shell = New-Object -ComObject WScript.Shell
          $sc = $shell.CreateShortcut($lnk)
          if ($sc.TargetPath -notlike '*powershell.exe') { throw "bad target: $($sc.TargetPath)" }
          if ($sc.Arguments -notlike '*start-demiurgos.ps1*start*') { throw "bad arguments: $($sc.Arguments)" }
          if ($sc.IconLocation -notlike '*demiurgos.ico*') { throw "bad icon: $($sc.IconLocation)" }
          Write-Output 'desktop shortcut OK'

      - name: Payload audit runtime regression (allow-list must apply)
        # Bug 1 guard: PowerShell variable names are CASE-INSENSITIVE, so the
        # local accumulator once collided with the -Allow parameter (both
        # `$allow`) and clobbered it to an empty array. This runtime cell
        # executes -Allow for real on Windows; it fails before the rename and
        # passes after.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'payload-audit-regression'
          if (Test-Path $base) { Remove-Item -Recurse -Force $base }
          $stage = Join-Path $base 'stage'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'app') | Out-Null
          Set-Content -Path (Join-Path $stage 'app/main.py') -Value "print('hello')" -Encoding ascii
          Set-Content -Path (Join-Path $stage 'LICENSE') -Value 'terms' -Encoding ascii
          # the manifest lives OUTSIDE the audited stage tree
          $manifest = Join-Path $base 'manifest.json'
          Set-Content -Path $manifest -Encoding ascii `
            -Value '{"schema_version":1,"payload":["app/main.py"]}'
          # the allow file carries exactly LICENSE: the allow-list MUST apply
          $allow = Join-Path $base 'allow.txt'
          Set-Content -Path $allow -Value 'LICENSE' -Encoding ascii
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/payload_audit.ps1 `
            -Root $stage -Manifest $manifest -Allow $allow
          if ($LASTEXITCODE -ne 0) {
            throw "allow-list regression: expected exit 0, got $LASTEXITCODE (the -Allow parameter was clobbered)"
          }
          # a path in neither list is still denied (default-DENY stays intact)
          Set-Content -Path (Join-Path $stage 'rogue.txt') -Value 'rogue' -Encoding ascii
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/payload_audit.ps1 `
            -Root $stage -Manifest $manifest -Allow $allow
          if ($LASTEXITCODE -ne 1) {
            throw "default-DENY regression: expected exit 1 for rogue.txt, got $LASTEXITCODE"
          }
          Write-Output 'payload audit runtime regression OK (allow-list applies; rogue path denied)'
          # The GitHub Actions pwsh shell reports the step exit code as the
          # $LASTEXITCODE of the LAST native command; the expected rogue-deny
          # above left it at 1. Every assertion passed, so reset it explicitly.
          exit 0

      - name: Install a working minisign (official 0.12 win64 build)
        shell: pwsh
        run: |
          # chocolatey only ships minisign 0.8.0, which predates the "-G -W"
          # unencrypted-keygen flag the harness uses, so the signed-channel
          # cells cannot run with it. Install the official 0.12 win64 build.
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $dest = Join-Path $env:RUNNER_TEMP 'minisign'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Recurse -Filter 'minisign.exe' |
            Where-Object { $_.FullName -match '[\\/]x86_64[\\/]' } | Select-Object -First 1
          if (-not $exe) { throw 'x86_64 minisign.exe not found in the archive' }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
          & $exe.FullName -v

      - name: Installer contract suite (Windows cells, real powershell.exe)
        shell: bash
        run: |
          ".venv/Scripts/python.exe" -m pytest \
            src/tools/demiurgos-suite/wiki/tests/test_installer_contract.py -q

      - name: Download the built frontend dist (the PS boot smoke serves "/" from it)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-dist-ubuntu-latest
          path: frontend/dist

      - name: PS 5.1 launcher boot smoke (powershell.exe -NoProfile -File)
        shell: bash
        run: |
          ".venv/Scripts/python.exe" -m pytest \
            src/tools/demiurgos-suite/wiki/tests/test_launcher_boot_smoke.py -q \
            -k "powershell or m1"
  payload-audit-parity:
    # Bug guard (release-payload-audit-parity): the release packaging gate had
    # TWO implementations, and only the POSIX one honoured the shared
    # content-scan allow-list. The Windows cell therefore rejected the shipped
    # content scanner's own rule literals (content_scan.py, author-path) while
    # Linux/macOS stayed green, and because the packaging matrix deliberately
    # runs only on push to master, review never saw it: every release package
    # was red for weeks with a green PR gate. Here each cell runs the port it
    # ships with, against the SAME fixture tree, on every pull request.
    name: Payload audit parity (${{ matrix.cell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cell: posix
            venv_python: .venv/bin/python
          - os: windows-latest
            cell: windows
            venv_python: .venv/Scripts/python.exe
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Create the wheels-only venv (pytest only, the fixture is stdlib)
        shell: bash
        run: |
          uv venv .venv --python 3.12
          uv pip install --python "${{ matrix.venv_python }}" --only-binary=:all: pytest

      - name: Run the payload-audit port parity cells
        # The POSIX cells are skipped on Windows and the PowerShell cells are
        # skipped elsewhere, so each cell exercises exactly its shipped port;
        # both assert the same verdicts on the same fixture tree.
        shell: bash
        run: |
          "${{ matrix.venv_python }}" -m pytest \
            src/tools/demiurgos-suite/wiki/tests/test_payload_audit.py \
            -q -k "PayloadAuditPortParity"
