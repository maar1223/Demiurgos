# Native Hermes Telegram ingress policy. Groups are deny-by-default.
#
# FAIL-CLOSED: empty allowlists reject EVERY update. Authorize explicitly:
#
#   private_chat_ids: [123456789]            # owner chat ids
#   approved_groups:                          # group chat id -> approved senders
#     987654321: [123456789, 555000111]
#
# Loaded by src/tools/idea_capture/config.py (load_policy). Hermes consumes
# authorized_bindings after its own gateway authorization. The legacy `serve`
# entrypoint remains compatibility-only and is not the production supervisor.
private_chat_ids: [<telegram-id>]
approved_groups:
  {}
authorized_bindings:
  - platform: telegram
    chat_id: <telegram-id>
    user_id: <telegram-id>
    profile: default
limits:
  image_mb: 20
  audio_mb: 50
  audio_minutes: 5
  raw_retention_days: 30
# AI gate (R-1): "ai" lets the assistant decide per turn whether to capture or
# converse; "strict" restores the pre-change unconditional capture. Precedence:
# DEMIURGOS_IDEA_CAPTURE_MODE env var > this field > default "ai". Any other
# value falls back to "ai" with a warning. Resolved by
# src/tools/idea_capture/config.py (resolve_capture_mode).
capture_mode: ai
